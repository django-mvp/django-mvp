{# @description The brand logo image, via the configured logo resolver. #}
{# @prop class:text | description:"Extra classes on the img element." #}
{# @prop max-height:text | description:"Max height passed to the logo resolver." #}
{% load i18n mvp %}
<c-vars class max-height />
{% logo_url max_height as logo %}
<img src="{{ logo }}"
     alt="{% trans "Site Logo" %}"
     class="w-auto max-w-full object-contain mx-auto {{ class }}"
     {{ attrs }} />
