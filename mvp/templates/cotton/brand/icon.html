{# @description The brand icon image, via the configured icon resolver. #}
{# @prop max-height:text | description:"Max height passed to the icon resolver." #}
{# @prop class:text | description:"Extra classes on the img element." #}
{% load i18n mvp %}
<c-vars max-height class />
<img src="{% icon_url max_height %}"
     alt="{% trans "Icon" %}"
     {% if class %}class="{{ class }}"{% endif %}
     {{ attrs }} />
