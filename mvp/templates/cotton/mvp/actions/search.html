{# @description Navbar search input; renders an input that is not wired to a form or a view — it submits nothing on its own. #}
{% load i18n %}
<c-join only>
  <c-icon name="search"
          class="join-item btn btn-square btn-ghost" />
  <c-form.input size="sm"
                class="join-item w-full"
                placeholder="{% trans "Search..." %}"
                aria-label="{% trans "Search" %}"
                only />
</c-join>
