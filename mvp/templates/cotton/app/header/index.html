<c-vars :sticky="mvp_config.layout.navbar.sticky" />
{% comment %}
  The scroll handler writes to the layout store (assets/js/layout.js)
  instead of local component state, so other regions can read whether the
  header has scrolled — the shadow behaviour itself is unchanged (T006).
{% endcomment %}
<div class="mvp-header w-full backdrop-blur{% if sticky %} sticky z-10 top-0{% endif %}"
     {% if sticky %}x-data @scroll.window="$store.layout.headerStuck = window.scrollY > 0" :class="{ 'shadow-xs': $store.layout.headerStuck }"{% endif %}>
  {{ above }}
  <c-app.header.navbar>
    <c-slot name="right">{{ right }}</c-slot>
  </c-app.header.navbar>
  {{ tray }}
  {{ below }}
</div>
