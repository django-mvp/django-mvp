<c-vars form-obj formset inlines />
<form x-data="{form: {}}"
      {% if form_obj.is_multipart or formset.is_multipart %}enctype="multipart/form-data"{% else %}{% for inline in inlines %}{% if inline.is_multipart %}enctype="multipart/form-data"{% endif %}{% endfor %}{% endif %}
      {{ attrs }}>
  {% if method|lower == "post" %}
    {% csrf_token %}
  {% endif %}
  {% if form_obj %}<c-form.render :form="form_obj" />{% endif %}
  {{ slot }}
</form>
