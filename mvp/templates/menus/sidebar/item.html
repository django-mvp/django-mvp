<c-menu.item :href="url"
             :active="selected"
             icon="{{ icon }}"
             class="is-drawer-close:tooltip is-drawer-close:tooltip-right"
             data-tip="{{ label }}"
             only>
  <span>{{ label }}</span>
  {% if badge %}<c-badge size="sm" :text="badge" only />{% endif %}
</c-menu.item>
