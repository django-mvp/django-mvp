{% load flex_menu %}
{% if collapsible %}
  <c-menu.submenu icon="{{ icon }}" :open="selected" only>
    <c-slot name="text">
      <span>{{ label }}</span>
    </c-slot>
    {% for child in children %}
      {% render_item child renderer=renderer %}
    {% endfor %}
  </c-menu.submenu>
{% else %}
  <li></li>
  <c-menu.title text="{{ label }}" class="uppercase" only />
  {% for child in children %}
    {% render_item child renderer=renderer %}
  {% endfor %}
{% endif %}
