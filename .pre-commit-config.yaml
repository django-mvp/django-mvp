# Standard pre-commit configuration (django-mvp/shared
# templates/pre-commit-config.yaml), with the built-stylesheet exclusions this
# repository needs on top.
#
# Python tools run as *local* hooks through `uv run` so their versions come
# from the mvp-shared[dev] bundle, one version source for every repository
# instead of per-repo `rev:` pins that drift under autoupdate.
#
# black and pyupgrade are absent: `ruff format` replaces black, and ruff's
# UP rules ([tool.ruff.lint]) cover pyupgrade.

exclude: "^docs/|/migrations/|^tests/"
default_stages: [pre-commit]

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Built assets are generated (minified, no trailing newline): the
      # stylesheet's compile check fails on a hook-added newline, and
      # rewriting the JS bundle's bytes breaks its byte-for-byte drift check.
      #
      # Scoped to the built bundle by name: mvp/static/js/formset.js and
      # list_view.js are hand-written and still get fixed by these hooks.
      - id: trailing-whitespace
        exclude: '^mvp/static/(css/.*\.(css|br)|js/django-mvp\.js)$'
      - id: end-of-file-fixer
        exclude: '^mvp/static/(css/.*\.(css|br)|js/django-mvp\.js)$'
      - id: check-yaml

  # uv-lock rewrites uv.lock when pyproject.toml has moved on. The build
  # workflow's `uv sync --locked` fails on a stale lockfile, so running this
  # here means the lockfile is already correct by the time CI looks at it.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.18
    hooks:
      - id: uv-lock

  # Local hooks that use the project environment
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        # Without this, parallel batches race on the shared .mypy_cache —
        # INTERNAL ERROR on a cold cache. Matches what mirrors-mypy ships.
        require_serial: true
        types: [python]
        files: ^mvp/
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        pass_filenames: false
        always_run: true

# pre-commit.ci runs only the env-independent hooks; the local project-env hooks
# run in each repo's own CI (the shared build workflow's Code Quality job).
ci:
  autoupdate_schedule: monthly
  skip: [ruff, ruff-format, mypy, deptry]
  submodules: false
