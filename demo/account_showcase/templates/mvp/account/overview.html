{% extends "mvp/account/overview.html" %}
{% load i18n %}
{% block account.cards %}
  {{ block.super }}
  <c-mvp.card title="{% trans "Component Library" %}"
          icon="overview">
    <c-mvp.text>
      {% trans "Every packaged component the shell ships, with the markup that renders it." %}
    </c-mvp.text>
    <c-slot name="footer">
      <c-button href="{% url 'layout' %}"
                text="{% trans "Browse components" %}"
                icon="arrow-right"
                reverse />
    </c-slot>
  </c-mvp.card>
{% endblock account.cards %}
