<c-vars eyebrow heading lead info actions />
<section data-own-layout {{ attrs }}>
  <p data-slot="eyebrow">{{ eyebrow }}</p>
  <h2 data-slot="heading">{{ heading }}</h2>
  <p data-slot="lead">{{ lead }}</p>
  <div data-slot="info">{{ info }}</div>
  <div data-slot="actions">{{ actions }}</div>
</section>
