name: Publish

# Publishes to PyPI when a release is published (or a v* tag is pushed by a
# user). Release creation itself is owned by the Tag Release workflow; the
# CHANGELOG section is written before release by Prepare Release.
#
# Note: releases/tags created by the Tag Release workflow with the default
# GITHUB_TOKEN do not trigger this workflow — set the RELEASE_TOKEN org secret
# (see django-mvp/shared README, Release Flow) or run this manually via
# workflow_dispatch.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'

      # --check fails when uv.lock is out of date with pyproject.toml, so a
      # release never ships from a tree whose lockfile disagrees with it.
      - name: Build package
        run: |
          uv lock --check
          uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
