name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'mvp/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/tests.yml'
  # No paths filter on pull_request: these checks are ruleset-required, and a
  # path-filtered required check never reports on out-of-scope PRs, blocking merge.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  call-tests:
    uses: django-mvp/shared/.github/workflows/tests.yml@v0.3.2
    with:
      coverage-package: mvp
      # Downloads chromium so the browser tests actually run. Without it they
      # are marked, skipped and green, which is indistinguishable from passing.
      install-playwright: true
    secrets: inherit
