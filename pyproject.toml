[project]
name = "django-mvp"
description = "MVP framework for Django - scaffold production-ready applications with sophisticated layouts and UI patterns designed for data-centric applications."
license = "MIT"
keywords = [
    "django",
    "mvp",
    "minimum viable product",
    "bootstrap",
    "layouts",
    "portal",
    "research",
    "data",
    "scaffold",
]
dynamic = ["version", "classifiers"]
readme = "README.md"
authors = [{ name = "Sam", email = "samuel.scott.jennings@gmail.com" }]
requires-python = '>=3.12,<4.0'
dependencies = [
    'django (>=5.2)',              # only actively supported Django releases
    "django-cotton (==2.6.1)",
    "django-flex-menus (>=0.4.3)",
    "django-easy-icons (>=0.6)",
    "mergedeep (>=1.3,<2.0)",
    "django-crispy-forms (>=2.7,<3.0)",
    "crispy-tailwind (>=1.0.3,<2.0)",
]
# Optional integrations (django-tables2, django-filter, ...) are NOT extras —
# they live in guarded modules under mvp.integrations and require the
# corresponding package only when explicitly imported. django-crispy-forms and
# crispy-tailwind above are plain runtime dependencies, not an integration:
# form rendering requires them on every install.

[project.urls]
homepage = "https://github.com/django-mvp/django-mvp"
repository = "https://github.com/django-mvp/django-mvp"


[tool.poetry]
version = "0.17.0"
packages = [{ include = "mvp" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-poetry = '>=2.0,<3.0'

[tool.poetry.group.test.dependencies]
Django = ">=5.2.16"
mvp-shared = { git = "https://github.com/django-mvp/shared.git", rev = "v0.3.2", extras = [
    "test",
] }

[tool.poetry.group.dev.dependencies]
Django = ">=5.2.16"
django-distill = "^3.0"
django-filter = "^26.1"
django-tables2 = "^3.0.0"
django-htmx = ">=1.28.0,<2.0"
mvp-shared = { git = "https://github.com/django-mvp/shared.git", rev = "v0.3.2", extras = [
    "dev",
] }
django-tailwind = { extras = [
    "cookiecutter",
    "honcho",
    "reload",
], version = "^4.4.2" }
brotli = "^1.2.0"
# Renders docs/utility-classes.md inside the demo app's own "Utility Classes"
# page, so the docs stay one source of truth instead of being copied into a
# template. Already present transitively (pulled in by rich, via django-distill);
# declared explicitly here because the demo app now imports it directly.
# Demo-only: never a runtime dependency of the mvp package itself.
markdown-it-py = "^4.2.0"

[build-system]
requires = ['poetry-core (>=2.0,<3.0)']
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."pytest11"]
mvp = "mvp.fixtures"


[tool.forge.conformance]
# tests/test_components/ exercises Cotton templates under mvp/templates/cotton/.
# Those have no Python module behind them — there is no mvp/components/ package
# and there should not be — so the mirror-the-source-tree rule has nothing to
# match. Declared here rather than carried as accepted drift, because the point
# is that no source module exists to mirror, not that the tests are misplaced.
# tests/test_demo/ exercises demo/, the example project used to develop and
# showcase the package. demo/ is a top-level app, not a submodule of mvp/ —
# the only package this repo ships, per tool.poetry.packages above — so the
# mirror check's guess of mvp/demo/<module>.py can never exist. Declared here
# for the same reason as the entry above: the mismatch is by design, not
# drift to fix.
# tests/test_templates.py exercises the packaged template chain's own wiring —
# which names resolve, and what they extend — against raw .html files under
# mvp/templates/. There is no mvp/templates.py and there cannot be, for the same
# reason as the first entry above.
# tests/test_conftest.py exercises the test suite's own shared fixtures module,
# tests/conftest.py. Its subject is test infrastructure, not a packaged module,
# so the mirror check's guess of mvp/conftest.py can never exist either.
# tests/test_frontend_runtime.py and its _e2e sibling exercise the shipped
# JavaScript bundle (mvp/static/js/django-mvp.js) and the script tags in
# mvp/templates/mvp/base.html. Their subject is a build artifact and a template,
# so mvp/frontend_runtime.py can never exist — the same case as the entries
# above, not misplaced tests.
non-mirror-paths = [
    "tests/test_components/",
    "tests/test_demo/",
    "tests/test_templates.py",
    "tests/test_conftest.py",
    "tests/test_frontend_runtime.py",
    "tests/test_frontend_runtime_e2e.py",
]

[tool.deptry]
extend_exclude = ["tasks.py"]

[tool.deptry.package_module_name_map]
# Map PyPI package names to their actual importable module names where they differ
django-flex-menus = ["flex_menu"]
django-filter = ["django_filters"]
django-easy-icons = ["easy_icons"]

[tool.deptry.per_rule_ignores]
DEP001 = ["invoke", "bs4", "pytest"]
# These packages are used indirectly (INSTALLED_APPS, templates)
DEP002 = [
    "django-flex-menus",
    "django-easy-icons",
    "django-crispy-forms",
    "crispy-tailwind",
]
# django-crispy-forms, crispy-tailwind: reached through {% load %} and
#   INSTALLED_APPS rather than a Python import.
# invoke: dev task runner, only imported by tasks.py.
# pytest: mvp/fixtures.py is a pytest11 plugin — it is only ever imported by
#   pytest itself, so pytest is guaranteed present wherever that module loads.
# bs4: an optional extra in both call sites (mvp/fixtures.py and the component
#   documentation tag), imported lazily inside a try/except with a fallback.
DEP003 = ["invoke", "pytest", "bs4"]
DEP004 = ["django_filters", "django_tables2", "django_htmx", "markdown_it"]
# markdown_it: demo/views.py renders docs/utility-classes.md into the demo app's
#   own "Utility Classes" page; demo-only, never a runtime dependency of mvp.

[tool.ruff]
# line-length is deliberately unset: Ruff's default is 88, matching Black, which
# is what Django, pytest and httpx ship. PEP 8 caps a team's own preference at 99.
# target-version is deliberately unset too: Ruff infers it from requires-python,
# so it cannot drift above the versions this package actually supports.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*/migrations/*.py",
    "staticfiles/*",
    "docs/",
    ".github/",
]
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E",
    "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # ClassAttributesShouldBeAnnotated
    "RUF012",
    "TRY003",
    # Use of mark_safe
    "S308",
    # Use of standard pseudo-random generators
    "S311",
    "A003",
    "F403",
    "F405",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
# `tests/**`, not `**/tests/*`: the latter matches only files directly inside a
# `tests` directory, so every nested test module (tests/test_views/…) silently
# missed these ignores.
# S101/S105/S106: asserts and placeholder credentials are the point of a test.
# RUF002/RUF003: prose punctuation in test docstrings and comments is not a defect
# (the rules stay enabled for the package itself).
"tests/**" = ["S101", "S105", "S106", "RUF002", "RUF003"]
# Demo/dev settings carry an intentional non-secret placeholder SECRET_KEY.
"**/demo/settings.py" = ["S105"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "lf"
exclude = ["*/migrations/*.py"]

[tool.djlint]
blank_line_after_tag = "c-vars"
close_void_tags = true
custom_html = "c-[\\w.-]+"
format_js = true
format_css = true
indent = 2
max_attribute_length = 50
max_blank_lines = 0
max_line_length = 119
ignore = "H016,H030,H031,H021,D018,H037"
format_attribute_template_tags = false

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.mypy]
files = ["mvp"]
strict = false
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "flex_menu",
    "flex_menu.*",
    "django_cotton.*",
    "django_filters.*",
    "django_tables2.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short"]
markers = ["e2e: End-to-end tests using Playwright"]
# pytest-playwright's sync API keeps an asyncio event loop running on the main
# thread, which makes Django's async-safety guard fire a false positive
# SynchronousOnlyOperation during pytest-django's (synchronous) DB setup for any
# live_server browser test. This is a sync Django app with no async views, so
# the guard has no real work to do here — disable it for the test run.
env = ["DJANGO_ALLOW_ASYNC_UNSAFE=1"]


[tool.coverage.run]
source = ["mvp"]
omit = ["*/tests/*", "*/migrations/*", "*/__pycache__/*", "*/node_modules/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
